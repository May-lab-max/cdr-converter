name: Refresh rates

on:
  # Primary trigger: Vercel Cron -> api/dispatch-refresh.js -> workflow_dispatch,
  # because GitHub's own schedule starts this workflow 4-11 hours late.
  # The schedule below stays as a backup in case the Vercel trigger fails.
  schedule:
    # Cron is UTC. Toronto is UTC-4 (EDT) or UTC-5 (EST).
    - cron: "45 13 * * 1-5"   # 9:45 EDT / 8:45 EST
    - cron: "45 14 * * 1-5"   # 10:45 EDT / 9:45 EST
    - cron: "15 20 * * 1-5"   # 16:15 EDT / 15:15 EST
    - cron: "15 21 * * 1-5"   # 17:15 EDT / 16:15 EST
  workflow_dispatch:

permissions:
  contents: write

# Never run two refreshes at once (their pushes would collide).
concurrency:
  group: refresh-rates
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch rates
        run: python update_rates.py

      - name: Commit if changed
        run: |
          git config user.name "rates-bot"
          git config user.email "actions@github.com"
          git add rates.json rates.js
          git diff --cached --quiet && echo "No change" && exit 0
          # A late duplicate run often changes only generated_at: skip it.
          if ! git diff --cached -U0 -- rates.json | grep -E '^[+-] ' | grep -qv '"generated_at"'; then
            echo "Only the timestamp changed"; exit 0
          fi
          git commit -m "Refresh rates $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
